<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181D" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <!-- Outer Aperture Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#redGlow)" stroke-width="8" stroke-dasharray="120 40" />
  
  <!-- Center Play Accent -->
  <polygon points="230,200 320,256 230,312" fill="#FFFFFF" />
  <circle cx="340" cy="180" r="12" fill="#E50914" />
</svg>
